services:
  - type: web
    name: inventorysystem
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DB_SSL
        value: "true"
      - key: COUNT_CHECK_TIMEOUT_MS
        value: "15000"
      - key: RUTEN_SELLER_ID
        value: "1994160"
      - key: RUTEN_API_TIMEOUT_MS
        value: "20000"
      - key: RUTEN_REQUEST_DELAY_MS
        value: "100"
